name: 构建安卓 APK

# 触发方式：
#   1. 在 GitHub 仓库页面 → Actions → 本工作流 → Run workflow（手动，最常用）
#   2. 推送到 main 分支时自动构建（v1.8.5 起：由工作流自动按 versionName 建 Release，
#      无需再手工打 tag —— 手工打 v* 标签仍然支持）
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    # action-gh-release 需要写权限才能创建 Release（GITHUB_TOKEN 默认只读）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.2
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: 接受 SDK 许可证并安装编译平台
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin --no-daemon

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # 清缓存避免历史构建污染
      - name: 清理构建缓存
        run: ./gradlew clean --no-daemon

      # 固定签名：从 repo Secret 解码 PKCS12 keystore，所有版本签名一致 → 可无缝覆盖升级
      - name: 解码签名密钥并构建 Release APK
        run: |
          echo "${{ secrets.WUZ_KEYSTORE_B64 }}" | base64 -d > wlz-release.p12
          export KEYSTORE_FILE="$(pwd)/wlz-release.p12"
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          WUZ_STORE_PASSWORD: ${{ secrets.WUZ_STORE_PASSWORD }}

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: wanlongzhou-supply-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # v1.8.5 起：不再依赖手工打 tag —— 直接从 build.gradle 读 versionName，
      # 建 v<versionName> 的 Release 并附上 APK，供应用内更新一键下载。
      # 下载直链：https://github.com/<repo>/releases/download/v<versionName>/app-release.apk
      - name: 读取版本名
        id: ver
        run: |
          VN=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$VN" ]; then echo "未能从 build.gradle 解析 versionName" >&2; exit 1; fi
          echo "version=$VN" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并附 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 万龙洲供应链 App v${{ steps.ver.outputs.version }}
          body: 自动构建的 Release 安装包（固定签名，可无缝覆盖升级；应用内更新可用）
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}