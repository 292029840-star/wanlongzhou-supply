plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wanlongzhou.supply'
    compileSdk 34

    defaultConfig {
        applicationId "com.wanlongzhou.supply"
        minSdk 26            // Android 8.0 及以上
        targetSdk 34
        versionCode 9
        versionName "1.8"
    }

    // 固定签名：CI 从 repo Secret 解码 PKCS12 keystore，所有版本签名一致 → 可无缝覆盖升级。
    // 本地开发无 KEYSTORE_FILE 环境变量时跳过签名（不影响 assembleDebug）。
    def ksFile = System.getenv("KEYSTORE_FILE")
    def ksPass = System.getenv("WUZ_STORE_PASSWORD") ?: ""
    signingConfigs {
        release {
            if (ksFile != null && ksFile != "") {
                storeFile file(ksFile)
                storeType "PKCS12"
                storePassword ksPass
                keyAlias "wlz-release"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            if (ksFile != null && ksFile != "") {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // AGP 8.x 默认不生成 BuildConfig；v1.7 应用内更新需要 BuildConfig.VERSION_CODE
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    // 下拉刷新（原生手势）
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
